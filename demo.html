<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tts-voice-pack · 一键试听</title>
<style>
  :root{--pink:#e0407a;--purple:#7a52d1;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
       background:linear-gradient(135deg,#ffd6e7 0%,#ffeef5 55%,#d6ecff 100%);
       display:flex;align-items:center;justify-content:center;padding:28px;}
  .card{background:#fff;border-radius:24px;box-shadow:0 18px 50px rgba(150,80,140,.18);max-width:640px;width:100%;padding:30px 30px 24px;}
  h1{margin:0 0 4px;font-size:26px;background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#8c7a99;font-size:14px;margin-bottom:20px}
  .big{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fff0f6,#f3edff);border-radius:16px;padding:14px 16px;margin-bottom:18px}
  .big button{border:0;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:16px;font-weight:600;border-radius:999px;padding:12px 22px}
  .big button:active{transform:scale(.97)}
  ul{list-style:none;padding:0;margin:0}
  li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;transition:.15s}
  li:hover{background:#fff5f9}
  li .play{border:0;cursor:pointer;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:15px;flex:0 0 auto}
  li .txt{flex:1;color:#4a3b56;font-size:15px}
  li .len{color:#b3a4bf;font-size:13px}
  audio{width:100%;margin-top:16px}
  footer{margin-top:16px;font-size:12px;color:#b3a4bf;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🐋 tts-voice-pack</h1>
  <div class="sub">第 1 弹：鲸鱼娘 · 零样本克隆 · 不用训练 · 点一下就能听</div>
  <div class="big">
    <button onclick="playAll()">▶ 一键听完 5 条</button>
    <span style="color:#8c7a99;font-size:13px">约 19 秒</span>
  </div>
  <ul id="list"></ul>
  <audio id="player" controls preload="none"></audio>
  <footer>参考音频与每句文字严格对齐 · 拿来就能当 TTS 参考</footer>
</div>
<script>
const VOICE = 'jingyuniang';
const CLIPS = [
  {f:'01.mp3', t:'别、别看我啦，脸有点烫。'},
  {f:'02.mp3', t:'唔……你靠这么近，我心跳好快。'},
  {f:'03.mp3', t:'才、才不是想你呢，哼。'},
  {f:'04.mp3', t:'你回来啦，我等你好久了。'},
  {f:'05.mp3', t:'抱一下嘛，就一下下。'},
];
const base = `voices/${VOICE}/demo/`;
const player = document.getElementById('player');
const list = document.getElementById('list');
CLIPS.forEach((c, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<button class="play" aria-label="播放">▶</button>
                  <span class="txt">${c.t}</span>
                  <span class="len">${i + 1}/5</span>`;
  li.querySelector('.play').onclick = () => { player.src = base + c.f; player.play(); };
  list.appendChild(li);
});
function playAll(){ player.src = 'demo/all-in-one.mp3'; player.play(); }
let idx = -1;
player.addEventListener('play', () => { idx = CLIPS.findIndex(c => player.src.endsWith(c.f)); });
player.addEventListener('ended', () => {
  if (idx >= 0 && idx < CLIPS.length - 1) { player.src = base + CLIPS[idx + 1].f; player.play(); }
});
</script>
</body>
</html>
